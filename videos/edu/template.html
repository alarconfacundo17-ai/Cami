<!doctype html>
<html><head><meta charset="utf-8">
<!-- Plantilla de video educativo vertical. El contenido viene de words.js (tiempos de cada palabra) y data.js (escenas). -->
<style>
  :root { --bg:#EDEDEA; --ink:#121212; --green:#1E7B55; --red:#D2503F; --pink:#F6E2DE; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); font-family:Inter, sans-serif; color:var(--ink); }
  .mono { font-family:"JetBrains Mono", monospace; letter-spacing:2px; }
  .abs { position:absolute; }
  .scene { position:absolute; inset:0; opacity:0; }
  #bar { left:60px; right:60px; top:110px; height:60px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#555; border-bottom:2px solid #cfd0cc; }
  .big { font-weight:800; font-size:104px; line-height:1.04; letter-spacing:-3px; }
  .w { display:inline-block; opacity:0; }
  .green { color:var(--green); }
  .num { font-weight:800; font-size:190px; color:var(--green); letter-spacing:-6px; line-height:1; }
  .title { font-weight:800; font-size:78px; letter-spacing:-2px; line-height:1.05; }
  .card { background:#fff; border-radius:28px; box-shadow:0 18px 40px rgba(0,0,0,.10); }
  .label { font-size:30px; color:#777; padding:0 40px 10px; }
  .row { display:flex; align-items:center; gap:26px; font-size:44px; font-weight:600; padding:18px 40px; opacity:0; }
  .row.bad { background:var(--pink); }
  .row .mk { font-size:54px; width:50px; text-align:center; }
  .row.ok .mk { color:var(--green); } .row.bad .mk { color:var(--red); }
  .tag { font-family:"JetBrains Mono", monospace; font-size:30px; color:var(--green); min-width:110px; }
  .strike { position:relative; }
  .strike::after { content:""; position:absolute; left:0; top:52%; height:6px; background:var(--red); width:var(--sw,0%); }
  .chat { padding:26px 34px; display:flex; flex-direction:column; gap:20px; }
  .bub { max-width:78%; padding:22px 30px; border-radius:30px; font-size:42px; font-weight:600; opacity:0; }
  .bub.in { align-self:flex-start; background:#E6E7E3; border-bottom-left-radius:8px; }
  .bub.out { align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:8px; }
  .bub.note { align-self:center; background:none; color:var(--red); font-family:"JetBrains Mono", monospace; font-size:32px; }
  .slots { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:20px 34px 30px; }
  .slot { border-radius:18px; padding:22px 0; text-align:center; font-size:40px; font-weight:700; opacity:0; }
  .slot.free { background:#DDEFE5; color:var(--green); } .slot.busy { background:#E6E7E3; color:#999; text-decoration:line-through; }
  .slot.pick { background:var(--green); color:#fff; }
  #sub { left:80px; right:80px; top:1560px; text-align:center; }
  #sub span { display:inline-block; background:#121212; color:#fff; font-weight:700; font-size:50px; line-height:1.25; padding:14px 26px; border-radius:18px; }
  #sub b { color:#7FD3A8; }
</style></head>
<body>
<div id="bar" class="abs mono"><span id="brand"></span><span id="counter"></span></div>
<div id="root"></div>
<div id="sub" class="abs"><span></span></div>
<script src="words.js"></script>
<script>
const ICONS = {
  store:`<svg viewBox="0 0 300 300" width="300" height="300"><path d="M30 110 L50 40 H250 L270 110 Z" fill="#1E7B55" stroke="#121212" stroke-width="10" stroke-linejoin="round"/><rect x="45" y="110" width="210" height="160" fill="#fff" stroke="#121212" stroke-width="10"/><rect x="120" y="180" width="60" height="90" fill="#121212"/><rect x="70" y="140" width="40" height="40" fill="#CFE3D8"/></svg>`,
  google:`<svg viewBox="0 0 600 160" width="600" height="160"><rect x="8" y="8" width="584" height="144" rx="72" fill="#fff" stroke="#121212" stroke-width="10"/><circle cx="90" cy="80" r="30" fill="none" stroke="#1E7B55" stroke-width="12"/><line x1="112" y1="102" x2="140" y2="130" stroke="#1E7B55" stroke-width="12" stroke-linecap="round"/><text x="170" y="96" font-family="Inter" font-weight="700" font-size="48" fill="#121212">peluquería cerca</text></svg>`,
  instagram:`<svg viewBox="0 0 300 300" width="300" height="300"><rect x="30" y="30" width="240" height="240" rx="70" fill="#fff" stroke="#121212" stroke-width="12"/><circle cx="150" cy="150" r="58" fill="none" stroke="#121212" stroke-width="12"/><circle cx="212" cy="88" r="14" fill="#1E7B55"/></svg>`,
  clock:`<svg viewBox="0 0 300 300" width="300" height="300"><circle cx="150" cy="150" r="120" fill="#fff" stroke="#121212" stroke-width="12"/><line x1="150" y1="150" x2="150" y2="75" stroke="#121212" stroke-width="12" stroke-linecap="round"/><line id="hand" x1="150" y1="150" x2="210" y2="150" stroke="#1E7B55" stroke-width="12" stroke-linecap="round"/><circle cx="150" cy="150" r="12" fill="#121212"/></svg>`,
  phone:`<svg viewBox="0 0 300 300" width="300" height="300"><rect x="80" y="10" width="140" height="280" rx="28" fill="#fff" stroke="#121212" stroke-width="12"/><rect x="104" y="60" width="92" height="40" rx="12" fill="#1E7B55"/><rect x="104" y="115" width="70" height="30" rx="10" fill="#D9DAD6"/><rect x="104" y="160" width="92" height="40" rx="12" fill="#1E7B55"/><circle cx="150" cy="255" r="12" fill="#121212"/></svg>`,
  calendar:`<svg viewBox="0 0 300 300" width="300" height="300"><rect x="30" y="50" width="240" height="220" rx="24" fill="#fff" stroke="#121212" stroke-width="12"/><rect x="30" y="50" width="240" height="60" rx="24" fill="#1E7B55"/><line x1="90" y1="25" x2="90" y2="75" stroke="#121212" stroke-width="12" stroke-linecap="round"/><line x1="210" y1="25" x2="210" y2="75" stroke="#121212" stroke-width="12" stroke-linecap="round"/><rect x="70" y="140" width="40" height="34" rx="6" fill="#D9DAD6"/><rect x="130" y="140" width="40" height="34" rx="6" fill="#1E7B55"/><rect x="190" y="140" width="40" height="34" rx="6" fill="#D9DAD6"/><rect x="70" y="200" width="40" height="34" rx="6" fill="#D9DAD6"/><rect x="130" y="200" width="40" height="34" rx="6" fill="#D9DAD6"/></svg>`,
  chat:`<svg viewBox="0 0 300 300" width="300" height="300"><path d="M30 40 H270 a20 20 0 0 1 20 20 V200 a20 20 0 0 1 -20 20 H120 L60 275 L75 220 H30 a20 20 0 0 1 -20 -20 V60 a20 20 0 0 1 20 -20Z" fill="#fff" stroke="#121212" stroke-width="12"/><circle cx="95" cy="130" r="16" fill="#121212"/><circle cx="150" cy="130" r="16" fill="#121212"/><circle cx="205" cy="130" r="16" fill="#121212"/></svg>`,
  link:`<svg viewBox="0 0 300 300" width="300" height="300"><rect x="20" y="105" width="150" height="90" rx="45" fill="none" stroke="#121212" stroke-width="16"/><rect x="130" y="105" width="150" height="90" rx="45" fill="none" stroke="#1E7B55" stroke-width="16"/></svg>`,
  comment:`<svg viewBox="0 0 300 300" width="300" height="300"><path d="M40 30 H260 a30 30 0 0 1 30 30 V190 a30 30 0 0 1 -30 30 H130 L60 280 L80 220 H40 a30 30 0 0 1 -30 -30 V60 a30 30 0 0 1 30 -30Z" fill="#1E7B55" stroke="#121212" stroke-width="10"/></svg>`
};
const W = window.WORDS;                                   // [[palabra, segundos], ...]
const norm = s => s.toLowerCase().replace(/[^a-záéíóúñü0-9]/g,'');
function T(word, occ=1){ let n=0; for(const [w,t] of W){ if(norm(w)===norm(word) && ++n===occ) return t; } throw new Error('palabra no encontrada: '+word+' #'+occ); }
function idx(word, occ=1){ let n=0; for(let i=0;i<W.length;i++){ if(norm(W[i][0])===norm(word) && ++n===occ) return i; } throw new Error('palabra no encontrada: '+word); }
const clamp=x=>Math.max(0,Math.min(1,x));
const eo=(t,a,d=0.35)=>{const x=clamp((t-a)/d); return 1-Math.pow(1-x,3);};
const back=(t,a,d=0.45)=>{const x=clamp((t-a)/d); const c=1.9; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const anim=[]; window.POPS=[];
function el(html, parent){ const d=document.createElement('div'); d.innerHTML=html.trim(); const e=d.firstChild; parent.appendChild(e); return e; }
function pop(e,a,d=0.3,sound=false){ anim.push(t=>{const k=eo(t,a,d); e.style.opacity=k; e.style.transform=`translateY(${(1-k)*50}px)`;}); if(sound) POPS.push(a); }
function popScale(e,a,sound=true){ anim.push(t=>{e.style.opacity=clamp((t-a)/0.15); e.style.transform=`scale(${Math.max(0,back(t,a))})`;}); if(sound) POPS.push(a); }
function words(range, green, parent, cls){ const [a,b]=range; const box=el(`<div class="${cls}"></div>`, parent);
  for(let i=a;i<=b;i++){ const txt=W[i][0]; const g=green.some(x=>norm(x)===norm(txt)); const s=el(`<span class="w ${g?'green':''}">${txt}</span>`, box); box.append(' '); pop(s,W[i][1],0.25); } return box; }
function card(c, top, parent){
  const box=el(`<div class="abs card" style="left:110px; top:${top}px; width:860px; padding:${c.kind==='chat'?0:26}px 0"></div>`, parent);
  if(c.label) el(`<div class="mono label" style="${c.kind==='chat'?'padding:26px 40px 0':''}">${c.label}</div>`, box);
  pop(box, c.at, 0.4, true);
  if(c.kind==='chat'){ const ch=el('<div class="chat"></div>',box); c.items.forEach(m=>{ const b=el(`<div class="bub ${m.who}">${m.text}</div>`, ch); pop(b,m.at,0.25,true); }); }
  else if(c.kind==='slots'){ const g=el('<div class="slots"></div>',box); c.items.forEach(s=>{ const e=el(`<div class="slot ${s.state}">${s.text}</div>`, g); pop(e,s.at,0.2); if(s.pickAt) anim.push(t=>{ if(t>=s.pickAt) e.className='slot pick'; }); }); POPS.push(c.items[0].at); }
  else { c.items.forEach(r=>{ const mk = r.mark==='ok'?'✓':r.mark==='bad'?'✗':''; const row=el(`<div class="row ${r.mark||''}">${mk?`<span class="mk">${mk}</span>`:''}${r.tag?`<span class="tag">${r.tag}</span>`:''}<span class="${r.strikeAt?'strike':''}">${r.text}</span></div>`, box);
      pop(row,r.at,0.25,true); if(r.strikeAt){ const s=row.lastChild; anim.push(t=>s.style.setProperty('--sw',(100*eo(t,r.strikeAt,0.3))+'%')); } }); }
  return box;
}
function build(D){
  document.getElementById('brand').textContent=D.brand;
  const root=document.getElementById('root'); const sc=D.scenes; let item=0; const nItems=sc.filter(s=>s.type==='item').length;
  sc.forEach((s,k)=>{
    const a=s.from, b=k+1<sc.length? sc[k+1].from-0.05 : 999;
    const S=el('<div class="scene"></div>', root);
    anim.push(t=>{const v=Math.min(eo(t,a,0.25),1-clamp((t-b)/0.2)); S.style.opacity=v; S.style.transform=`translateX(${(1-eo(t,a,0.3))*120-clamp((t-b)/0.2)*120}px)`;});
    if(a>0) POPS.push(a);
    if(s.type==='hook'){
      words(s.range, s.green||[], el('<div class="abs" style="left:60px; top:230px; width:960px"></div>',S), 'big');
      if(s.icon){ const ic=el(`<div class="abs" style="left:${540-150*(s.iconScale||1.4)}px; top:${s.iconTop||1000}px; transform-origin:center"></div>`,S); ic.innerHTML=ICONS[s.icon]; ic.firstChild.setAttribute('width',300*(s.iconScale||1.4)); ic.firstChild.setAttribute('height',300*(s.iconScale||1.4)); popScale(ic,s.iconAt);
        if(s.strikeAt){ const sv=el(`<svg class="abs" style="left:${540-230}px; top:${(s.iconTop||1000)-20}px" width="460" height="460"><line x1="30" y1="430" x2="430" y2="30" stroke="#D2503F" stroke-width="34" stroke-linecap="round" stroke-dasharray="570" stroke-dashoffset="570"/></svg>`,S); const ln=sv.firstChild; anim.push(t=>ln.setAttribute('stroke-dashoffset',570*(1-eo(t,s.strikeAt,0.3)))); POPS.push(s.strikeAt); } }
    }
    if(s.type==='big'){
      const c=el(`<div class="abs" style="left:340px; top:480px; width:400px; height:400px; border-radius:50%; background:var(--green); color:#fff; font-weight:800; font-size:${s.num.length>1?220:300}px; display:flex; align-items:center; justify-content:center; letter-spacing:-8px">${s.num}</div>`,S); popScale(c,s.numAt);
      words(s.range, s.green||[], el('<div class="abs" style="left:60px; top:980px; width:960px; text-align:center"></div>',S), 'big');
    }
    if(s.type==='item'){
      item++; const label=String(item).padStart(2,'0');
      anim.push(t=>{ if(t>=a && t<b) document.getElementById('counter').textContent=`${label} / ${String(nItems).padStart(2,'0')}`; });
      el(`<div class="abs num" style="left:60px; top:210px">${label}</div>`,S);
      const ti=el(`<div class="abs title" style="left:330px; top:230px; width:700px">${s.title}</div>`,S); pop(ti,Math.min(s.titleAt,a+0.1));
      let top=500;
      if(s.icon){ const ic=el(`<div class="abs" style="left:0; width:1080px; top:470px; display:flex; justify-content:center"></div>`,S); ic.innerHTML=ICONS[s.icon]; popScale(ic,Math.min(s.iconAt,a+0.4)); top = s.icon==='google'? 690 : 820; }
      if(s.card) card(s.card, top, S);
    }
    if(s.type==='cta'){ s.at=Math.min(s.at,a+0.15);
      anim.push(t=>{ if(t>=a) document.getElementById('counter').textContent=''; });
      const ic=el('<div class="abs" style="left:390px; top:430px"></div>',S); ic.innerHTML=ICONS.comment; popScale(ic,s.at);
      const kw=el(`<div class="abs" style="left:0; width:1080px; top:500px; text-align:center; color:#fff; font-weight:800; font-size:${s.keyword.length>5?52:s.keyword.length>3?66:90}px">${s.keyword}</div>`,S); popScale(kw,s.at+0.1,false);
      const l1=el(`<div class="abs big" style="left:60px; width:960px; top:830px; text-align:center">Comenta <span class="green">${s.keyword}</span></div>`,S); pop(l1,s.at);
      const l2=el(`<div class="abs" style="left:60px; width:960px; top:980px; text-align:center; font-size:50px; font-weight:600; color:#444">${s.sub}</div>`,S); pop(l2,s.subAt);
      anim.push(t=>{ ic.style.translate=`0 ${t>s.at+0.6? -Math.abs(Math.sin((t-s.at-0.6)*4))*24*Math.exp(-(t-s.at-0.6)*0.8):0}px`; });
    }
  });
  window.DURATION = W[W.length-1][1] + 2.2;
  const groups=[]; let g=[];
  W.forEach((w,i)=>{ g.push(i); if(/[.,:;?!]$/.test(w[0]) || g.length>=4){ groups.push(g); g=[]; } }); if(g.length) groups.push(g);
  const span=document.querySelector('#sub span'); const hl=(D.subHighlight||[]).map(norm);
  anim.push(t=>{ let cur=null; for(const gr of groups){ const st=W[gr[0]][1]-0.05; const last=W[gr[gr.length-1]]; if(t>=st && t<last[1]+0.6) cur=gr; }
    if(!cur){ span.style.opacity=0; return; } span.style.opacity=1;
    span.innerHTML=cur.map(i=>{ const txt=W[i][0].replace(/[.,:;]$/,''); const on=t>=W[i][1]-0.03; return `<i style="font-style:normal; opacity:${on?1:0.35}">${hl.includes(norm(txt))?'<b>'+txt+'</b>':txt}</i>`; }).join(' '); });
}
window.render = t => { document.getElementById('counter').textContent=''; anim.forEach(f=>f(t)); };
</script>
<script src="data.js"></script>
<script>build(window.DATA); window.render(0);</script>
</body></html>
